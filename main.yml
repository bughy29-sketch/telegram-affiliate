name: Automatizare Telegram Affiliate

# 1. CÂND RULEAZĂ WORKFLOW-UL?
on:
  schedule:
    - cron: '0 */4 * * *'  # Rulează automat la fiecare 4 ore
  workflow_dispatch:       # Îți permite să declanșezi rularea manual din GitHub

# 2. CE FACE WORKFLOW-UL?
jobs:
  run-script:
    runs-on: ubuntu-latest  # Rulează pe o mașină virtuală cu Linux oferită gratuit de GitHub

    steps:
      # Pasul A: Descarcă codul din repository
      - name: Checkout cod
        uses: actions/checkout@v4

      # Pasul B: Instalează mediul Python
      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Pasul C: Instalează dependențele din requirements.txt
      - name: Instalare dependențe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pasul D: Rulează scriptul și îi transmite secretele 
      - name: Executare main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_URL: ${{ secrets.FEED_URL }}
        run: |
          python main.py
